<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        .form-container {
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
        }
        .form-container h2 {
            margin-bottom: 1.5rem;
            color: #333;
            text-align: center;
        }
        .input-group {
            margin-bottom: 1rem;
        }
        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
        }
        .input-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        .error {
            color: red;
            font-size: 0.85rem;
            margin-top: 0.25rem;
            display: none;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        button:hover {
            background-color: #45a049;
        }
        .success {
            color: green;
            font-size: 0.95rem;
            text-align: center;
            margin-top: 1rem;
        }
        .back-link {
            margin-top: 15px;
            display: inline-block;
            color: #333;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Register</h2>
    <form id="myForm">
        <div class="input-group">
            <label for="username">Name</label>
            <input type="text" id="username" placeholder="Enter your name">
            <span class="error" id="nameError">Name is required</span>
        </div>
        <div class="input-group">
            <label for="email">Email</label>
            <input type="text" id="email" placeholder="Enter your email">
            <span class="error" id="emailError">Enter a valid email</span>
        </div>
        <button type="submit">Submit</button>
    </form>
    <p id="successMsg" class="success"></p>
    
    <!-- ಹೋಮ್ ಪೇಜ್‌ಗೆ ಹಿಂತಿರುಗಲು ಲಿಂಕ್ -->
    <div style="text-align: center;">
        <a href="index.html" class="back-link">← Back to Home</a>
    </div>
</div>

<script>
    document.getElementById('myForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        let isValid = true;
        const name = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        
        if (name === '') {
            document.getElementById('nameError').style.display = 'block';
            isValid = false;
        } else {
            document.getElementById('nameError').style.display = 'none';
        }

        if (email === '' || !email.includes('@')) {
            document.getElementById('emailError').style.display = 'block';
            isValid = false;
        } else {
            document.getElementById('emailError').style.display = 'none';
        }

        if (isValid) {
            document.getElementById('successMsg').innerText = "Form submitted successfully!";
        } else {
            document.getElementById('successMsg').innerText = "";
        }
    });
</script>

</body>
</html>
