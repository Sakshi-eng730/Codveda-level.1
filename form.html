<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Form</title>
    <style>
        .form-container { width: 300px; margin: 50px auto; font-family: Arial; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 8px; }
        .error { color: red; font-size: 0.85rem; display: none; }
        .success { color: green; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Registration Form</h2>
    <form id="myForm">
        <div class="input-group">
            <label for="username">Name</label>
            <input type="text" id="username">
            <span class="error" id="nameError">Name is required</span>
        </div>
        <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email">
            <span class="error" id="emailError">Enter a valid email</span>
        </div>
        <button type="submit">Submit</button>
    </form>
    <p id="successMsg" class="success"></p>
</div>

<script>
    document.getElementById('myForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        let isValid = true;
        const name = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        
        if (name === '') {
            document.getElementById('nameError').style.display = 'block';
            isValid = false;
        } else {
            document.getElementById('nameError').style.display = 'none';
        }

        if (email === '' || !email.includes('@')) {
            document.getElementById('emailError').style.display = 'block';
            isValid = false;
        } else {
            document.getElementById('emailError').style.display = 'none';
        }

        if (isValid) {
            document.getElementById('successMsg').innerText = "Form submitted successfully!";
        }
    });
</script>

</body>
</html>
